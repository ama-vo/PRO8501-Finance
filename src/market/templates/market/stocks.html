
{% extends 'base.html' %}

{% block main_class %}container-fluid px-4{% endblock %}

{% block content %}
<div class="py-4 text-white">

    <form id="stock-form" class="row g-2 align-items-center mb-4">
        <div class="col-sm-6 col-md-4">
            <input type="text" id="symbol" class="form-control" value="AAPL"
                   placeholder="Ticker (ex : AAPL, AIR.PA, BTC-USD)"
                   autocomplete="off" aria-label="Ticker">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-light">Afficher</button>
        </div>
        <div class="col-12 col-md-auto ms-md-auto">
            <div class="btn-group" role="group" id="periods" aria-label="Période">
                <button type="button" class="btn btn-outline-light" data-period="7d">7J</button>
                <button type="button" class="btn btn-outline-light" data-period="1mo">1M</button>
                <button type="button" class="btn btn-outline-light" data-period="6mo">6M</button>
                <button type="button" class="btn btn-outline-light active" data-period="1y">1A</button>
                <button type="button" class="btn btn-outline-light" data-period="5y">5A</button>
            </div>
        </div>
    </form>

    <section class="card bg-black text-white rounded-4 border-secondary p-3">

        <div class="d-flex align-items-center gap-3 mb-3">

            <div class="rounded-circle bg-white d-flex align-items-center justify-content-center flex-shrink-0"
                 style="width: 55px; height: 55px; overflow: hidden;">

                <img id="stock-logo"
                     src=""
                     alt="Logo entreprise"
                     class="d-none"
                     referrerpolicy="no-referrer"
                     style="width: 100%; height: 100%; object-fit: contain; padding: 5px;">

                <span id="stock-logo-fallback" class="text-dark fw-bold">?</span>
            </div>

            <div>
                <div class="d-flex align-items-baseline gap-3 flex-wrap">
                    <h2 id="stock-symbol" class="mb-0">&nbsp;</h2>
                    <span id="stock-price" class="fs-4"></span>
                    <span id="stock-variation" class="fs-6"></span>
                </div>
            </div>

        </div>

        <div id="stock-error" class="alert alert-danger d-none" role="alert"></div>

        <div style="position: relative; height: calc(100vh - 280px); min-height: 360px;">
            <canvas id="stock-chart"></canvas>
        </div>

    </section>

</div>
{% endblock %}

{% block extra_js %}

<script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"
    integrity="sha384-zYPBGXwO4633CABX/5Spf6emCKUJCfoOkhOMYyxMsatqQZPnDblmmOewfjsIVWCM"
    crossorigin="anonymous"
></script>

<script>
    // URL de l'API Django
    const API_URL = "{% url 'stock_history' symbol='SYMBOL' %}";

    const form = document.getElementById("stock-form");
    const symbolInput = document.getElementById("symbol");
    const periodButtons = document.querySelectorAll("#periods button");
    const errorBox = document.getElementById("stock-error");

    const titleEl = document.getElementById("stock-symbol");
    const priceEl = document.getElementById("stock-price");
    const variationEl = document.getElementById("stock-variation");

    const logoEl = document.getElementById("stock-logo");
    const logoFallbackEl = document.getElementById("stock-logo-fallback");

    let chart = null;
    let currentPeriod = "1y";
    let requestId = 0;

    // Correspondance entre ticker et domaine de l'entreprise
    const COMPANY_DOMAINS = {
        "AAPL": "apple.com",
        "MSFT": "microsoft.com",
        "GOOGL": "google.com",
        "GOOG": "google.com",
        "AMZN": "amazon.com",
        "META": "meta.com",
        "NVDA": "nvidia.com",
        "TSLA": "tesla.com",
        "NFLX": "netflix.com",
        "OR.PA": "loreal.com",
        "MC.PA": "lvmh.com",
        "AIR.PA": "airbus.com",
        "TTE.PA": "totalenergies.com",
        "SAN.PA": "sanofi.com",
        "BNP.PA": "group.bnpparibas",
        "SU.PA": "se.com",
        "RMS.PA": "hermes.com",
        "CS.PA": "axa.com",
        "V": "visa.com",
        "MA": "mastercard.com",
        "KO": "coca-colacompany.com",
        "PEP": "pepsico.com",
        "DIS": "thewaltdisneycompany.com",
        "IBM": "ibm.com",
        "INTC": "intel.com",
        "AMD": "amd.com",
        "ADBE": "adobe.com",
        "CRM": "salesforce.com",
        "PYPL": "paypal.com"
    };

    // Afficher le logo de l'entreprise sélectionnée
    function updateCompanyLogo(symbol) {

        const normalizedSymbol = symbol.trim().toUpperCase();
        const domain = COMPANY_DOMAINS[normalizedSymbol];

        // Réinitialisation
        logoEl.classList.add("d-none");
        logoEl.removeAttribute("src");

        logoFallbackEl.textContent = normalizedSymbol.slice(0, 2) || "?";
        logoFallbackEl.classList.remove("d-none");

        // Aucun domaine connu
        if (!domain) return;

        // Gestion du chargement
        logoEl.onload = () => {
            logoEl.classList.remove("d-none");
            logoFallbackEl.classList.add("d-none");
        };

        logoEl.onerror = () => {
            logoEl.classList.add("d-none");
            logoFallbackEl.classList.remove("d-none");
        };

        // API Logo Hunter
        logoEl.src = `https://logos.hunter.io/${encodeURIComponent(domain)}`;
        logoEl.alt = `Logo de ${normalizedSymbol}`;
    }

    // Couleurs du graphique
    Chart.defaults.color = "#adb5bd";
    Chart.defaults.borderColor = "rgba(255, 255, 255, 0.08)";

    function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.toggle("d-none", !message);
    }

    // Récupération des données boursières
    async function loadHistory() {

        const symbol = symbolInput.value.trim();
        if (!symbol) return;

        const myRequest = ++requestId;
        showError("");

        try {
            const url = API_URL.replace("SYMBOL", encodeURIComponent(symbol));
            const response = await fetch(`${url}?period=${currentPeriod}`);

            let data = {};
            try {
                data = await response.json();
            } catch {
                // Réponse non JSON
            }

            if (myRequest !== requestId) return;

            if (!response.ok) {
                throw new Error(data.error || "Impossible de récupérer les données.");
            }

            drawChart(data);

        } catch (error) {
            if (myRequest !== requestId) return;
            showError(error.message || "Impossible de récupérer les données.");
        }
    }

    // Construction du graphique
    function drawChart(data) {

        const first = data.values[0];
        const last = data.values[data.values.length - 1];

        const change = ((last - first) / first) * 100;
        const isUp = change >= 0;
        const color = isUp ? "#22c55e" : "#ef4444";

        // Mise à jour de l'en-tête
        titleEl.textContent = data.symbol;

        // Mise à jour du logo
        updateCompanyLogo(data.symbol);

        priceEl.textContent = last.toLocaleString("fr-FR", {
            minimumFractionDigits: 2
        });

        variationEl.textContent =
            `${isUp ? "+" : ""}${change.toFixed(2)} %`;

        variationEl.className =
            "fs-6 " + (isUp ? "text-success" : "text-danger");

        // Destruction de l'ancien graphique
        if (chart) chart.destroy();

        chart = new Chart(document.getElementById("stock-chart"), {
            type: "line",

            data: {
                labels: data.labels,

                datasets: [{
                    label: data.symbol,
                    data: data.values,
                    borderColor: color,
                    backgroundColor: color + "22",
                    borderWidth: 2,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    tension: 0.2,
                    fill: true,
                }],
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,

                interaction: {
                    mode: "index",
                    intersect: false
                },

                plugins: {
                    legend: {
                        display: false
                    }
                },

                scales: {
                    x: {
                        ticks: {
                            maxTicksLimit: 8
                        }
                    },
                },
            },
        });
    }

    // Soumission du formulaire
    form.addEventListener("submit", (event) => {
        event.preventDefault();
        loadHistory();
    });

    // Changement de période
    periodButtons.forEach((button) => {

        button.addEventListener("click", () => {

            currentPeriod = button.dataset.period;

            periodButtons.forEach((b) => {
                b.classList.toggle("active", b === button);
            });

            loadHistory();
        });
    });

    // Premier affichage
    loadHistory();

</script>

{% endblock %}

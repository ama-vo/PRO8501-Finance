{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="{% static 'styles.css' %}">
    </head>

    <body class="body">
        <header>
           <nav class="navbar navbar-expand-sm navbar-dark py-1" style="background-color: #000000;">
                <div class="container-fluid px-3">
                    
                    <a class="navbar-brand py-0 me-4" href="{% url 'index' %}">
                        <img src="{% static 'logo_taurus_capital.png' %}" height="40"  class="d-inline-block align-middle" alt="Taurus Capital Logo">
                    </a>

                    <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavId" aria-controls="collapsibleNavId" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    
                    <div class="collapse navbar-collapse" id="collapsibleNavId">
                        <ul class="navbar-nav me-auto">
                            <li class="nav-item">
                                <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %} py-1" href="#">Dashboard</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link {% if request.resolver_match.url_name == 'history' %}active{% endif %} py-1" href="#">History</a>
                            </li>
                            <li class="nav-item">
				<a class="nav-link {% if request.resolver_match.url_name == 'stocks' %}active{% endif %} py-1" href="{% url 'stocks' %}">Stocks</a>
                            </li>
                           
                        </ul>
                        
                        <ul class="navbar-nav  my-0 gap-3">
                            <li class="nav-item">
                                <a class="nav-link {% if request.resolver_match.url_name == 'login' %}active{% endif %} " href="{% url 'login' %}">
                                     Log in
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link {% if request.resolver_match.url_name == 'signup' %}active{% endif %}" href="{% url 'signup' %}">
                                  Sign Up
                                </a>
                            </li>
                        </ul>
                        
                    </div>
                </div>
            </nav> 
        </header>
	<main class="{% block main_class %}container{% endblock %}">
        {% block content %}
        

        {% endblock %}
        
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        {% block extra_js %}{% endblock %}
    </body>
</html>

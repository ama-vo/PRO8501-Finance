<div class="mb-3">
    <label for="BuyingDate" class="form-label">Buying Date :</label>
    <input
        type="date"
        class="form-control"
        name="BuyingDate"
        id="BuyingDate"
    />
</div>

<div class="mb-3">
    <label for="address" class="form-label">Address :</label>
    <input
        type="text"
        class="form-control"
        name="address"
        id="address"
    />
</div>

<div class="mb-3">
    <label for="sellingPrice" class="form-label">Selling Price :</label>
    <input
        type="number"
        step="any"
        class="form-control"
        name="sellingPrice"
        id="sellingPrice"
    />
</div>

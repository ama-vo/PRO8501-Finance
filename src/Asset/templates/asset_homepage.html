{% extends 'base.html' %}
{% block content %}

{% if not assets %}
<div class="row justify-content-center mt-5">
    
    <div class="card  bg-black text-white rounded-4 border-secondary p-3 align-items-center justify-content-center">
        
        <div class="card-body ">
            
            <p class="card-text text-center">No assets were reported</p>
            

            <button
                type="button"
                class="btn btn-black border-secondary"
                data-bs-toggle="modal"
                data-bs-target="#assetForm"
            >
                + Add an Asset
            </button>
            
           {% include 'modalForm.html' %}
        
            
        </div>
        
    </div>
    

</div>
{% else %}

<div class="row  mt-5">
    <div class="col-6">
                <button
                type="button"
                class="btn btn-light border-secondary"
                data-bs-toggle="modal"
                data-bs-target="#assetForm"

            >
                + Add an Asset
            </button>
            
           {% include 'modalForm.html' %}

    </div>
</div>



{% include "assetDescription.html" %}
    
    
    {% endif %}

</div>
{% endblock %}

{% extends 'base.html' %}
{% block content %}

{% if not assets %}
<div class="row justify-content-center mt-5">
    
    <div class="card  bg-black text-white rounded-4 border-secondary p-3 align-items-center justify-content-center">
        
        <div class="card-body text-center">
            
            <p class="card-text text-center">No assets were reported</p>
            
            <!-- Modal trigger button -->
            <button
                type="button"
                class="btn btn-black border-secondary"
                data-bs-toggle="modal"
                data-bs-target="#assetForm"
            >
                + Add an Asset
            </button>
            
            <!-- Modal Body -->
            <!-- if you want to close by clicking outside the modal, delete the last endpoint:data-bs-backdrop and data-bs-keyboard -->
            <div
                class="modal fade"
                id="assetForm"
                tabindex="-1"
                data-bs-backdrop="static"
                data-bs-keyboard="false"
                
                role="dialog"
                aria-labelledby="assetForm"
                aria-hidden="true"
            >
                <div
                    class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-sm "
                    role="document"
                >
                    <div class="modal-content bg-black text-white border-secondary">
                        <div class="modal-header">
                            <h5 class="modal-title" id="modalTitleId">
                                Modal title
                            </h5>
                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="Close"
                            ></button>
                        </div>
                        <div class="modal-body">Body</div>
                        <div class="modal-footer">
                            <button
                                type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal"
                            >
                                Close
                            </button>
                            <button type="button" class="btn btn-primary">Save</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Optional: Place to the bottom of scripts -->
            <script>
                const myModal = new bootstrap.Modal(
                    document.getElementById("modalId"),
                    options,
                );
            </script>
            
            
            
        </div>
        
    </div>
    

</div>
{% else %}



{% endif %}
{% endblock %}

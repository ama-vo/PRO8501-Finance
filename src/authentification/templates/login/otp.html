{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center mt-5">
    <h2>Security Verification</h2>
    <p>Enter the code received by email :</p>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ redirect_field }}
        <div class="mb-3">
            <label for="otp-code" class="form-label">Verification code</label>
            <input
                type="text"
                id="otp-code"
                name="code"
                class="form-control"
                inputmode="numeric"
                autocomplete="one-time-code"
                pattern="[0-9]{6}"
                maxlength="6"
                required
            >
            {{ form.code.errors }}
        </div>
        <button type="submit" class="btn btn-light">Submit</button>
    </form>

    <form method="post" action="{% url 'cancel_login_code' %}" class="mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-link p-0">&larr; Back to login</button>
    </form>

</div>


{% endblock %}

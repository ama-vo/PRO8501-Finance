services:
  db:
    image: postgres:16-alpine
    container_name: taurus-db
    environment:
      POSTGRES_USER: ${USERNAME_DB}
      POSTGRES_PASSWORD: ${PASSWORD_DB}
      POSTGRES_DB: ${NAME_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERNAME_DB} -d ${NAME_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  web-app: 
    build: .
    container_name: taurus-web-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    environment:
      DB_NAME: ${NAME_DB}
      DB_USER: ${USERNAME_DB}
      DB_PASSWORD: ${PASSWORD_DB}
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  nginx-srv:
    image: nginx:latest
    container_name: taurus-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web-app

volumes:
  postgres_data:
  static_volume:
services:
  web-app:
    build: .
    container_name: taurus-web-app
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/taurus
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: taurus-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taurus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  
  